server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached — it contains hashed asset filenames.
    # A stale cached index.html causes NS_ERROR_CORRUPTED_CONTENT because the
    # browser requests old chunk hashes that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Hashed JS/CSS assets are immutable — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy — same-origin so the browser never has to call the backend's
    # own host:port directly (avoids mixed content / CORS across environments).
    # BACKEND_HOST/BACKEND_PORT are substituted at container start (see
    # frontend/Dockerfile) and come from the environment's non-secret config
    # (deployment/environments/<env>/), never hard-coded per environment here.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes return index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
