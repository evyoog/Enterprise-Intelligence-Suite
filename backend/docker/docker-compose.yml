services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eis_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - eis-platform-db:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eis_platform
      DB_USER: postgres
      DB_PASSWORD: root
    ports:
      - "8081:8081"

volumes:
  eis-platform-db:
