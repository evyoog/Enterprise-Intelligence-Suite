# C70: PostgreSQL integration tests for the search index (keyword, semantic,
# re-indexing, visibility). Used together with the "test" profile, only when
# EIS_PG_TEST_URL is set (for example jdbc:postgresql://localhost:5432/eis_search_test).
# PostgresSearchTestSupport recreates the eis_search_it schema from schema.sql
# before the context starts. The database needs pg_trgm and pgvector.
spring:
  datasource:
    url: ${EIS_PG_TEST_URL:jdbc:postgresql://localhost:5432/eis_search_test}?currentSchema=eis_search_it,public
    driver-class-name: org.postgresql.Driver
    username: ${EIS_PG_TEST_USER:postgres}
    password: ${EIS_PG_TEST_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: eis_search_it
