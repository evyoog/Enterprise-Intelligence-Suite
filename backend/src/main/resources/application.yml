spring:
  application:
    name: eis-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Local DB (your own machine) — ACTIVE
    # url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vyoog}?currentSchema=eis_platform,public
    # username: ${DB_USER:postgres}
    # password: ${DB_PASSWORD:root}
    # Live DB (shared RDS — vyg-pms/vyg-requirement also use this)
    # url: jdbc:postgresql://vyg-batch-1.cgtfswn9milw.ap-south-1.rds.amazonaws.com:5432/vygmicroservice?currentSchema=eis_platform,public
    # username: ${DB_USER:postgres}
    # password: ${DB_PASSWORD:vygpost23}
    # sandbox db for testing (shared RDS)
    url: jdbc:postgresql://vyg-batch-1.cgtfswn9milw.ap-south-1.rds.amazonaws.com:5432/sandbox?currentSchema=eis_platform,public
    username: ${DB_USER:sandboxadmin}
    password: ${DB_PASSWORD:vyg@2011}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: EisPlatformHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: eis_platform
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false


  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://user.evyoog.com/realms/eVyoog}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/certs}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:notifications@evyoog.com}
    password: ${SMTP_PASSWORD:jgnk rlrq utyv xbmt}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

vyoog:
  keycloak:
    token-uri: ${KEYCLOAK_TOKEN_URI:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/token}
    end-session-uri: ${KEYCLOAK_END_SESSION_URI:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/logout}
    ropc-client-id: ${KEYCLOAK_ROPC_CLIENT_ID:eis-platform-ui}
    ropc-client-secret: ${KEYCLOAK_ROPC_CLIENT_SECRET:KaoYtuxZxM6ODlFBJjZ1jzwU3rsLouIP}
    admin-base-uri: ${KEYCLOAK_ADMIN_BASE_URI:https://user.evyoog.com/admin/realms/eVyoog}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    debug-login-errors: ${VYOOG_AUTH_DEBUG_LOGIN_ERRORS:true}
    platform-mfa:
      issuer: ${PLATFORM_MFA_ISSUER:Vyoog}
      encryption-key: ${PLATFORM_MFA_ENCRYPTION_KEY:LKb+gXXGU4wZ2GWbKr8duwjPpXfN081ul35H6vSS7HU=}
      challenge-ttl-minutes: ${PLATFORM_MFA_CHALLENGE_TTL_MINUTES:5}
      max-challenge-attempts: ${PLATFORM_MFA_MAX_ATTEMPTS:5}
      recovery-code-count: ${PLATFORM_MFA_RECOVERY_CODE_COUNT:10}
  internal:

    partner-backend-urls: ${VYOOG_SSO_PARTNER_BACKEND_URLS:http://localhost:8080/api,http://localhost:8082,http://localhost:8083/api/v1}
    sso-shared-secret: ${INTERNAL_SSO_SHARED_SECRET:local-dev-only-shared-secret-change-me}

    sso-cookie-domain: ${SSO_COOKIE_DOMAIN:}

    impersonation-client-id: ${KEYCLOAK_IMPERSONATION_CLIENT_ID:eVyoog}
    impersonation-client-secret: ${KEYCLOAK_IMPERSONATION_CLIENT_SECRET:ssFF0O7wX5UlmWECCxjfOmflw4WRSJng}
  mail:
    from: ${MAIL_FROM:notifications@evyoog.com}
  registration:
    verification-token-ttl-hours: ${REGISTRATION_VERIFICATION_TTL_HOURS:24}

  billing:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

app:
  cors-allowed-origins: ${CORS_ORIGINS}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  backend-url: ${BACKEND_URL:http://localhost:8081/api}

  file-upload-dir: ${UPLOAD_DIR:./uploads/products}

  events:
    dispatcher:
      enabled: ${EVENTS_DISPATCHER_ENABLED:true}
      interval-ms: 5000
      batch-size: 100
      max-attempts: 10
      initial-delay-seconds: 30
      max-delay-seconds: 21600
    retention-days: 30

  rate-limit:
    per-key: 120
    per-user: 300
    per-ip: 60

  search:
    backfill-on-startup: ${SEARCH_BACKFILL_ON_STARTUP:true}
    result-limit: 50
    typo-threshold: 0.4
    correction-threshold: 0.45
    maintenance-interval-ms: 60000
    semantic:
      service-url: ${EMBEDDING_SERVICE_URL:}
      timeout-ms: 400
      similarity-threshold: 0.45
      chunk-size: 600
      chunk-overlap: 100
      rrf-k: 60
      candidates: 40


eis:
  knowledge:
    storage:
      provider: ${EIS_KNOWLEDGE_STORAGE_PROVIDER:none}
      bucket: ${EIS_KNOWLEDGE_BUCKET:}
      region: ${EIS_KNOWLEDGE_REGION:}
      endpoint: ${EIS_KNOWLEDGE_STORAGE_ENDPOINT:}
    video:
      max-size: ${EIS_KNOWLEDGE_VIDEO_MAX_SIZE:5368709120}
    document:
      max-size: ${EIS_KNOWLEDGE_DOCUMENT_MAX_SIZE:104857600}
    image:
      max-size: ${EIS_KNOWLEDGE_IMAGE_MAX_SIZE:10485760}
    audio:
      max-size: ${EIS_KNOWLEDGE_AUDIO_MAX_SIZE:104857600}
    multipart-threshold: ${EIS_KNOWLEDGE_MULTIPART_THRESHOLD:104857600}
    multipart-part-size: ${EIS_KNOWLEDGE_MULTIPART_PART_SIZE:104857600}
    upload-url-expiry: ${EIS_KNOWLEDGE_UPLOAD_URL_EXPIRY:PT15M}
    download-url-expiry: ${EIS_KNOWLEDGE_DOWNLOAD_URL_EXPIRY:PT5M}
    playback-url-expiry: ${EIS_KNOWLEDGE_PLAYBACK_URL_EXPIRY:PT1H}
    orphan-after: ${EIS_KNOWLEDGE_ORPHAN_AFTER:PT24H}
    seed:
      enabled: ${EIS_KNOWLEDGE_SEED_ENABLED:true}
    jobs:
      enabled: ${EIS_KNOWLEDGE_JOBS_ENABLED:true}
    youtube:
      api-key: ${EIS_YOUTUBE_API_KEY:}
      timeout-ms: 3000
  product-content:
    image-max-size: ${EIS_PRODUCT_CONTENT_IMAGE_MAX_SIZE:5242880}
    document-max-size: ${EIS_PRODUCT_CONTENT_DOCUMENT_MAX_SIZE:20971520}
    upload-url-expiry: ${EIS_PRODUCT_CONTENT_UPLOAD_URL_EXPIRY:PT15M}
    download-url-expiry: ${EIS_PRODUCT_CONTENT_DOWNLOAD_URL_EXPIRY:PT5M}
    view-url-expiry: ${EIS_PRODUCT_CONTENT_VIEW_URL_EXPIRY:PT1H}

# OpenAPI / Swagger 

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.vyoog.eisplatform: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
