spring:
  # Datasource is no longer set per-profile — see the comment/uncomment toggle in
  # the base application.yml instead.
  jpa:
    # SQL echo is off by default (it floods the console, e.g. the outbox poller every few seconds).
    # To debug a query, start with JPA_SHOW_SQL=true.
    show-sql: ${JPA_SHOW_SQL:false}

app:
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://192.168.1.4:5173}

vyoog:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
