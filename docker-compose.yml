# Local development infrastructure.
#   docker compose up -d            → PostgreSQL only (then run backend/frontend natively, see scripts/dev.sh)
#   docker compose --profile ai up  → also starts ai-service
#
# On first start (empty volume) Postgres creates the eis_platform schema and loads
# backend/src/main/resources/db/schema.sql. To re-initialise: docker compose down -v
services:
  postgres:
    # C70: PostgreSQL 16 with pgvector (semantic search); pg_trgm is included.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-vyoog}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}   # local dev only
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eis-db:/var/lib/postgresql/data
      - ./deployment/docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./backend/src/main/resources/db/schema.sql:/eis-schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    ports:
      - "8000:8000"
    # REQ-PRT-003: EMBEDDING_PROVIDER / EMBEDDING_MODEL come from config/secrets.env.
    env_file:
      - path: ./config/secrets.env
        required: false

volumes:
  eis-db:
