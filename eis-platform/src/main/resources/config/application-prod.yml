spring:
  # Connection url/username/password come from the comment/uncomment toggle in
  # base application.yml now, not from here — only the pool size is bumped for
  # prod load.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
