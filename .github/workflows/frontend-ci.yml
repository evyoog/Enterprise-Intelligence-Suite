name: Frontend CI

on:
  push:
    branches: [dev, main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Non-blocking until the existing lint errors in frontend/src are fixed
      # (react-hooks/purity, set-state-in-effect, react-refresh/only-export-components).
      # Remove continue-on-error once `npm run lint` passes.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
